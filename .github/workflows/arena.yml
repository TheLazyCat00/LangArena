name: Arena

# Runs the LangArena suite with one job per run (language/compiler variant):
# each job builds only its own Docker image chain, so it fits a hosted runner's
# disk. A final job merges the per-run results, ranks them in the job summary,
# and uploads the merged results file and the generated website.
#
# Start it from the Actions tab, or push a branch named arena/<anything>
# (arena/test<anything> runs the small test.js fixture instead of run.js).
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Regex selecting run names (empty = every run in the group)
        default: ''
      group:
        description: prod, hack or all
        default: prod
      fixture:
        description: Use the small test.js fixture instead of the full run.js workloads
        type: boolean
        default: false
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read

concurrency:
  group: arena-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      fixture: ${{ steps.list.outputs.fixture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: list
        env:
          RUNS: ${{ inputs.runs }}
          GROUP: ${{ inputs.group || 'prod' }}
          FIXTURE: ${{ inputs.fixture || startsWith(github.ref_name, 'arena/test') }}
        run: |
          echo "matrix=$(ruby .github/arena/list-runs.rb "$GROUP" "$RUNS")" >> "$GITHUB_OUTPUT"
          echo "fixture=$FIXTURE" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: ${{ matrix.run.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Free disk space for the image chain
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the image chain for ${{ matrix.run.container }}
        env:
          CONTAINER: ${{ matrix.run.container }}
        run: |
          chain=()
          service="$CONTAINER"
          while :; do
            chain=("$service" "${chain[@]}")
            parent=$(grep -m1 -oP '^FROM langarena:\K\S+' "docker/$service") || break
            service="$parent"
          done
          echo "Building: ${chain[*]}"
          for service in "${chain[@]}"; do
            docker compose build "$service"
          done
          df -h /
      - name: Run ${{ matrix.run.name }}
        env:
          RUN_NAME: ${{ matrix.run.name }}
          TEST: ${{ needs.plan.outputs.fixture == 'true' && '1' || '' }}
        run: |
          ls results > /tmp/before.txt
          ruby benchmarks.rb
          mkdir -p /tmp/arena-result
          for f in results/*.js; do
            grep -qxF "$(basename "$f")" /tmp/before.txt || cp "$f" /tmp/arena-result/
          done
          ls /tmp/arena-result
      - name: Name the artifact
        id: slug
        if: always()
        env:
          NAME: ${{ matrix.run.name }}
        run: echo "slug=$(echo "$NAME" | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: result-${{ steps.slug.outputs.slug }}
          path: |
            /tmp/arena-result/*.js
            /tmp/log_crash.txt
          if-no-files-found: warn
          retention-days: 30

  merge:
    needs: bench
    if: always() && needs.bench.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: result-*
          path: parts
      - name: Merge and rank
        run: |
          out="results/$(date -u +%Y-%m-%d)-github-actions.js"
          ruby .github/arena/merge.rb "$out" summary.md $(find parts -name '*.js')
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "MERGED=$out" >> "$GITHUB_ENV"
      - name: Generate the website
        run: cd docs && ruby gen.rb "../$MERGED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arena-results
          path: |
            ${{ env.MERGED }}
            summary.md
            parts/**/log_crash.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arena-site
          path: docs/

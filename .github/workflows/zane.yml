name: Zane

on:
  pull_request:
    paths:
      - 'zane/**'
      - '.github/workflows/zane.yml'
      - 'test.js'
      - 'run.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zane
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Zane tools
        run: |
          curl -fLsS https://github.com/zane-lang/zane/releases/download/v0.15/zane-linux-x86_64 -o "$RUNNER_TEMP/zane"
          echo "d5f89774a8694c9cabe5a0782d46cc1e2f1a9e5f03c790a4b8480b66f8346232  $RUNNER_TEMP/zane" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/zane"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zane" toolchain install v0.32
      - name: Fetch and build
        run: |
          zane fetch
          zane build
      - name: Check reference fixtures and runner protocol
        run: python3 tests/runner.py
      - name: Check codec round trips
        run: zane test
      - name: Preserve optimized executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zane-linux
          path: zane/out/host/
          retention-days: 7

  production:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore optimized executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: zane-linux
          path: zane/out/host/
      - name: Check full-size workloads in isolated processes
        working-directory: zane
        run: |
          chmod +x out/host/zane
          python3 tests/production.py --shard ${{ matrix.shard }} --shards 5
